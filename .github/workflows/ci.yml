name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fredo secret scan
        run: npx trufflehog filesystem . --only-verified --fail

      - name: npm audit
        run: npm audit --audit-level=critical

      - name: Run unit tests
        run: npm test

      - name: Check coverage (proof-engine.ts >= 80%)
        run: npm run test:coverage -- --coverage.thresholds.lines=80

      - name: Build
        run: npm run build
